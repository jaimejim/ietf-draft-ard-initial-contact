<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Draft diff</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Side-by-side diff of two builds of the draft, in the layout and colours
     of the IETF iddiff/rfcdiff tool, rendered in the browser from
     builds/<sha>.txt. Query: ?from=<sha>[&to=<sha>]; "to" defaults to the
     latest build. -->
<style>
  body { font-family: monospace; margin: 0; }
  header { font-family: system-ui, sans-serif; font-size: 13px; padding: 8px 12px; border-bottom: 1px solid #ccc;
           display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
  header b { font-size: 15px; }
  select { font: inherit; max-width: 40vw; }
  #status { padding: 12px; font-family: system-ui, sans-serif; color: #555; }
  table { border-spacing: 0; width: 100%; table-layout: fixed; }
  th { padding: 2px 0; text-align: center; font-size: 0.86em; }
  td { padding: 0 4px; white-space: pre-wrap; word-wrap: break-word; vertical-align: top; font-size: 0.86em; }
  td.n { width: 3.2em; color: #888; text-align: right; padding: 0 4px 0 0; white-space: nowrap; }
  .left { background-color: #EEE; }
  .right { background-color: #FFF; }
  .lblock { background-color: #BFB; }
  .rblock { background-color: #FF8; }
  .skip td { text-align: center; color: #666; background: #ddd; font-style: italic; }
  .w-delete { color: #F00; text-decoration: line-through; }
  .w-insert { color: #008000; font-weight: bold; }
</style>
</head>
<body>
<header>
  <b>Draft diff</b>
  <label>from <select id="from"></select></label>
  <label>to <select id="to"></select></label>
  <span id="summary"></span>
</header>
<div id="status">Loading…</div>
<table id="diff"></table>
<script src="diff.min.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const status = document.getElementById('status');
  const index = await (await fetch('builds/index.json', {cache: 'no-cache'})).json();
  const builds = index.builds; // newest first
  const find = s => builds.find(b => s && (b.sha.startsWith(s) || s.startsWith(b.sha)));
  const from = find(q.get('from')) || builds[1];
  const to = q.get('to') && q.get('to') !== 'latest' ? find(q.get('to')) : builds[0];
  if (!from || !to) { status.textContent = 'Unknown build. Known builds: ' + builds.map(b => b.sha).join(', '); return; }

  for (const [id, sel] of [['from', from], ['to', to]]) {
    const el = document.getElementById(id);
    for (const b of builds) {
      const o = document.createElement('option');
      o.value = b.sha; o.textContent = `${b.sha}  ${b.date}  ${b.subject}`.slice(0, 80);
      o.selected = b.sha === sel.sha; el.appendChild(o);
    }
    el.onchange = () => {
      const f = document.getElementById('from').value, t = document.getElementById('to').value;
      location.search = `?from=${f}` + (t === builds[0].sha ? '' : `&to=${t}`);
    };
  }
  document.title = `Draft diff ${from.sha}..${to.sha}`;

  // Drop page breaks, running headers and footers, as rfcdiff does.
  const clean = t => t.replace(/\r/g, '').split('\n')
    .filter(l => !/^\f/.test(l) && !/\[Page \d+\]\s*$/.test(l)
                 && !/^(Internet-Draft|RFC \d+)\s{3,}\S.*\s{3,}\S+ \d{4}\s*$/.test(l))
    .join('\n').replace(/\n{3,}/g, '\n\n');
  const [oldText, newText] = await Promise.all([from, to].map(
    async b => clean(await (await fetch(`builds/${b.sha}.txt`)).text())));

  const esc = s => s.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
  const table = document.getElementById('diff');
  const label = b => `${b.file.replace(/\.txt$/, '')} @ ${b.sha} (${b.date})`;
  table.innerHTML = `<tr><th colspan="2">${esc(label(from))}</th><th colspan="2">${esc(label(to))}</th></tr>`;
  const row = (cls, ln, l, rn, r) => {
    const tr = document.createElement('tr'); if (cls === 'skip') tr.className = 'skip';
    tr.innerHTML = cls === 'skip'
      ? `<td colspan="4">${l}</td>`
      : `<td class="n">${ln}</td><td class="${cls === 'ctx' ? 'left' : 'lblock'}">${l}</td>` +
        `<td class="n">${rn}</td><td class="${cls === 'ctx' ? 'right' : 'rblock'}">${r}</td>`;
    table.appendChild(tr);
  };
  const CTX = 3;
  const parts = Diff.diffLines(oldText, newText);
  let ln = 1, rn = 1, changes = 0, first = true;
  const lines = v => v.replace(/\n$/, '').split('\n');
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    if (!p.added && !p.removed) {
      const ls = lines(p.value);
      const head = first ? [] : ls.slice(0, CTX);
      const last = i === parts.length - 1;
      const tail = last ? [] : ls.slice(Math.max(head.length, ls.length - CTX));
      const skipped = ls.length - head.length - tail.length;
      head.forEach(l => row('ctx', ln++, esc(l), rn++, esc(l)));
      if (skipped > 0) { row('skip', 0, `skipping to change at line ${ln + skipped}`); ln += skipped; rn += skipped; }
      tail.forEach(l => row('ctx', ln++, esc(l), rn++, esc(l)));
      first = false; continue;
    }
    let oldV = '', newV = '';
    if (p.removed) { oldV = p.value; if (parts[i + 1] && parts[i + 1].added) { newV = parts[i + 1].value; i++; } }
    else newV = p.value;
    let l = '', r = '';
    for (const w of Diff.diffWordsWithSpace(oldV, newV)) {
      if (w.removed) l += `<span class="w-delete">${esc(w.value)}</span>`;
      else if (w.added) r += `<span class="w-insert">${esc(w.value)}</span>`;
      else { l += esc(w.value); r += esc(w.value); }
    }
    const lc = oldV ? lines(oldV).length : 0, rc = newV ? lines(newV).length : 0;
    row('chg', lc ? ln : '', l.replace(/\n$/, ''), rc ? rn : '', r.replace(/\n$/, ''));
    ln += lc; rn += rc; changes++; first = false;
  }
  status.remove();
  document.getElementById('summary').textContent =
    changes ? `${changes} change${changes > 1 ? 's' : ''}` : 'No differences';
})().catch(e => { document.getElementById('status').textContent = 'Error: ' + e.message; });
</script>
</body>
</html>
