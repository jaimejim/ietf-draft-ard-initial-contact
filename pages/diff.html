<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Draft diff</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; color: #222; }
  header { padding: 12px 16px; border-bottom: 1px solid #ddd; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; }
  header h1 { font-size: 16px; margin: 0; }
  header label { font-size: 13px; color: #555; }
  select { font: inherit; font-size: 13px; max-width: 42vw; }
  #status { padding: 16px; color: #555; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; font: 12px/1.45 ui-monospace, Menlo, monospace; }
  td { vertical-align: top; padding: 0 8px; white-space: pre-wrap; word-wrap: break-word; width: 50%; }
  tr.ctx td { color: #666; }
  tr.skip td { text-align: center; color: #999; background: #f6f6f6; padding: 2px; font-style: italic; }
  tr.chg td.old { background: #fff5f5; }
  tr.chg td.new { background: #f3fff3; }
  del { background: #ffc9c9; text-decoration: none; }
  ins { background: #b6f2b6; text-decoration: none; }
  tr.sep td { border-top: 1px solid #e5e5e5; padding-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>Draft diff</h1>
  <label>from <select id="from"></select></label>
  <label>to <select id="to"></select></label>
  <span id="summary"></span>
</header>
<div id="status">Loading…</div>
<table id="diff"></table>
<script src="diff.min.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const status = document.getElementById('status');
  const index = await (await fetch('builds/index.json', {cache: 'no-cache'})).json();
  const builds = index.builds; // newest first
  const byPrefix = s => builds.find(b => s && (b.sha.startsWith(s) || s.startsWith(b.sha)));
  const from = byPrefix(q.get('from')) || builds[1];
  const to = q.get('to') && q.get('to') !== 'latest' ? byPrefix(q.get('to')) : builds[0];
  if (!from || !to) { status.textContent = 'Unknown build. Known: ' + builds.map(b => b.sha).join(', '); return; }

  for (const [id, sel] of [['from', from], ['to', to]]) {
    const el = document.getElementById(id);
    for (const b of builds) {
      const o = document.createElement('option');
      o.value = b.sha; o.textContent = `${b.sha} ${b.date} ${b.subject}`.slice(0, 90);
      o.selected = b.sha === sel.sha; el.appendChild(o);
    }
    el.onchange = () => {
      const f = document.getElementById('from').value, t = document.getElementById('to').value;
      location.search = `?from=${f}` + (t === builds[0].sha ? '' : `&to=${t}`);
    };
  }
  document.title = `Draft diff ${from.sha}..${to.sha}`;

  const clean = t => t.replace(/\r/g, '').split('\n')
    .filter(l => !/^\f/.test(l) && !/\[Page \d+\]\s*$/.test(l) && !/^(Internet-Draft|RFC \d+)\s{3,}\S.*\s{3,}\S+ \d{4}\s*$/.test(l))
    .join('\n').replace(/\n{3,}/g, '\n\n');
  const [oldText, newText] = await Promise.all([from, to].map(async b => clean(await (await fetch(`builds/${b.sha}.txt`)).text())));

  const esc = s => s.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
  const table = document.getElementById('diff');
  const row = (cls, l, r) => { const tr = document.createElement('tr'); tr.className = cls;
    tr.innerHTML = `<td class="old">${l}</td><td class="new">${r}</td>`; table.appendChild(tr); };
  const CTX = 3;
  const parts = Diff.diffLines(oldText, newText);
  let changes = 0, first = true;
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    if (!p.added && !p.removed) {
      const lines = p.value.replace(/\n$/, '').split('\n');
      const head = first ? [] : lines.slice(0, CTX);
      const tail = i === parts.length - 1 ? [] : lines.slice(Math.max(head.length, lines.length - CTX));
      const skipped = lines.length - head.length - tail.length;
      head.forEach(l => row('ctx', esc(l), esc(l)));
      if (skipped > 0) row('skip', `… ${skipped} unchanged lines …`, `… ${skipped} unchanged lines …`);
      tail.forEach(l => row('ctx', esc(l), esc(l)));
      first = false; continue;
    }
    let oldV = '', newV = '';
    if (p.removed) { oldV = p.value; if (parts[i + 1] && parts[i + 1].added) { newV = parts[i + 1].value; i++; } }
    else newV = p.value;
    let l = '', r = '';
    for (const w of Diff.diffWordsWithSpace(oldV, newV)) {
      if (w.removed) l += `<del>${esc(w.value)}</del>`;
      else if (w.added) r += `<ins>${esc(w.value)}</ins>`;
      else { l += esc(w.value); r += esc(w.value); }
    }
    row('chg sep', l, r); changes++; first = false;
  }
  status.remove();
  document.getElementById('summary').textContent =
    changes ? `${changes} changed block${changes > 1 ? 's' : ''}; page headers and footers ignored` : 'No differences';
})().catch(e => { document.getElementById('status').textContent = 'Error: ' + e.message; });
</script>
</body>
</html>
