<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compare builds</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Runs the IETF iddiff tool (https://github.com/ietf-tools/iddiff, vendored
     as iddiff.py) in the browser with Pyodide, on two builds of the draft
     stored as builds/<sha>.txt. Query: ?from=<sha>[&to=<sha>]; "to" defaults
     to the latest build. Output is iddiff's own side-by-side HTML. -->
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font-family: system-ui, sans-serif; font-size: 14px; color: #222; }
  header { padding: 10px 14px; border-bottom: 1px solid #ccc; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
  header b { font-size: 16px; margin-right: 6px; }
  select { font: inherit; font-size: 13px; max-width: 38vw; padding: 3px; }
  #status { color: #555; font-size: 13px; }
  iframe { flex: 1; border: 0; width: 100%; }
</style>
</head>
<body>
<header>
  <b>Compare builds</b>
  <label>from <select id="from"></select></label>
  <label>to <select id="to"></select></label>
  <span id="status">Loading…</span>
</header>
<iframe id="out" title="diff"></iframe>
<script src="https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const status = document.getElementById('status');
  const index = await (await fetch('builds/index.json', {cache: 'no-cache'})).json();
  const builds = index.builds; // newest first
  const find = s => builds.find(b => s && (b.sha.startsWith(s) || s.startsWith(b.sha)));
  const from = find(q.get('from')) || builds[1];
  const to = q.get('to') && q.get('to') !== 'latest' ? find(q.get('to')) : builds[0];
  if (!from || !to) { status.textContent = 'Unknown build. Known builds: ' + builds.map(b => b.sha).join(', '); return; }

  for (const [id, sel] of [['from', from], ['to', to]]) {
    const el = document.getElementById(id);
    for (const b of builds) {
      const o = document.createElement('option');
      o.value = b.sha; o.textContent = `${b.sha}  ${b.date}  ${b.subject}`.slice(0, 80);
      o.selected = b.sha === sel.sha; el.appendChild(o);
    }
    el.onchange = () => {
      const f = document.getElementById('from').value, t = document.getElementById('to').value;
      location.search = `?from=${f}` + (t === builds[0].sha ? '' : `&to=${t}`);
    };
  }
  document.title = `Compare builds ${from.sha}..${to.sha}`;

  status.textContent = 'Loading the Python runtime for iddiff (a few seconds the first time)…';
  const [py, code, oldText, newText] = await Promise.all([
    loadPyodide(),
    (await fetch('iddiff.py')).text(),
    (await fetch(`builds/${from.sha}.txt`)).text(),
    (await fetch(`builds/${to.sha}.txt`)).text(),
  ]);
  status.textContent = 'Running iddiff…';
  const name = b => `${b.file.replace(/\.txt$/, '')}-${b.sha}.txt`;
  py.FS.writeFile('/tmp/' + name(from), oldText);
  py.FS.writeFile('/tmp/' + name(to), newText);
  py.FS.writeFile('/tmp/iddiff.py', code);
  const html = py.runPython(`
import sys; sys.path.insert(0, '/tmp')
import iddiff
iddiff.get_iddiff('/tmp/${name(from)}', '/tmp/${name(to)}')
`);
  document.getElementById('out').srcdoc = html;
  status.textContent = 'iddiff side-by-side';
})().catch(e => { document.getElementById('status').textContent = 'Error: ' + e.message; });
</script>
</body>
</html>
