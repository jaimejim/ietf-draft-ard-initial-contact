name: "Update Editor's Copy"

on:
  push:
    paths-ignore:
    - README.md
    - CONTRIBUTING.md
    - LICENSE.md
    - .gitignore
  # No paths-ignore on pull requests: the main branch ruleset requires this
  # check, so a PR touching only README.md must still run it to be mergeable.
  pull_request:

jobs:
  build:
    name: "Update Editor's Copy"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: "Checkout"
      uses: actions/checkout@v6
      with:
        # Full history: the build index on gh-pages names source commits.
        fetch-depth: 0

    - name: "Setup"
      id: setup
      run: date -u "+date=%FT%T" >>"$GITHUB_OUTPUT"

    - name: "Caching"
      uses: actions/cache@v5
      with:
        path: |
          .refcache
          .venv
          .gems
          node_modules
          .targets.mk
        key: i-d-${{ steps.setup.outputs.date }}
        restore-keys: i-d-

    - name: "Build Drafts"
      id: build
      uses: martinthomson/i-d-template@v1
      with:
        token: ${{ github.token }}

    - name: "Fix Lints"
      id: fix-lint
      if: always() && steps.build.outcome == 'failure'
      uses: martinthomson/i-d-template@v1
      with:
        make: fix-lint

    - name: "Propose Linting Fixes"
      if: >
        always() &&
        steps.fix-lint.outcome != 'skipped' &&
        github.event.pull_request &&
        github.event.pull_request.head.repo.full_name == github.repository
      uses: parkerbxyz/suggest-changes@v3
      with:
        token: ${{ github.token }}

    - name: "Update GitHub Pages"
      uses: martinthomson/i-d-template@v1
      if: ${{ github.event_name == 'push' }}
      with:
        make: gh-pages
        token: ${{ github.token }}

    # Keeps builds/<draft>-<sha>.txt for every build and the diff.html viewer
    # on gh-pages, so https://jaime.win/<repo>/diff.html?from=<sha> works.
    - name: "Store Build for Diffs"
      if: ${{ github.event_name == 'push' }}
      run: |
        git clone -q --branch gh-pages --single-branch \
          "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" /tmp/gh-pages
        pages/update-builds.sh /tmp/gh-pages
        git -C /tmp/gh-pages add -A
        git -C /tmp/gh-pages -c user.name='github-actions[bot]' \
          -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
          commit -qm "Script storing build ${GITHUB_SHA::7} for diffs. [ci skip]" || exit 0
        # Another run may have pushed gh-pages meanwhile; rebase and retry.
        for i in 1 2 3; do
          git -C /tmp/gh-pages push -q origin gh-pages && break
          git -C /tmp/gh-pages -c user.name=bot -c user.email=bot@example.invalid \
            pull -q --rebase origin gh-pages
        done

    - name: "Archive Built Drafts"
      uses: actions/upload-artifact@v6
      with:
        name: drafts
        path: |
          draft-*.html
          draft-*.txt
